<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="100" height="100" rx="28" fill="url(#purpleGrad)" />
  
  <!-- Shopping Cart Base -->
  <path d="M 22 28 L 32 28 L 42 60 L 74 60 L 82 36 L 36 36" fill="none" stroke="url(#cartGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cart Wheels -->
  <circle cx="44" cy="72" r="5" fill="#ffffff" />
  <circle cx="72" cy="72" r="5" fill="#ffffff" />

  <!-- People/Share Icon overlay inside or above cart -->
  <circle cx="58" cy="24" r="7" fill="#38bdf8" />
  <path d="M 48 38 C 48 32 68 32 68 38" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
